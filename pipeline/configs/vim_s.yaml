# Mamba — tier base (~26M). VisualMamba/Vim: plano (no jerárquico), escaneo bidireccional.
# Requiere el repo hustvl/Vim y su checkpoint ImageNet oficial.
model:
  name: vim_s
  pretrained_ckpt: ~/tesis_v3/checkpoints/vim_s_midclstok_ft_81p6acc.pth

optimizer:
  lr: 3.0e-4
  weight_decay: 0.05

train:
  batch_size: 64
